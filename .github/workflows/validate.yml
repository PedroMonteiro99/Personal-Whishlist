name: Validate

# Ver PROJECT_BLUEPRINT.md — CI-001. É o portão dos pull requests: cobre o que
# o `ci` faz em `main` e acrescenta a validação do frontmatter MDX (SYNC-002).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validar frontmatter MDX
        run: pnpm tsx scripts/validate-content.ts

      - name: Testes
        run: pnpm test:run

      - name: Build
        run: pnpm build
